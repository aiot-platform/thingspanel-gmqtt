name: Docker Image Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build, for example v1.1.6"
        required: false

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: 获取版本号
      id: get_version
      run: |
        RELEASE_TAG="${{ github.event.release.tag_name }}"
        INPUT_VERSION="${{ github.event.inputs.version }}"
        if [ -n "$RELEASE_TAG" ]; then
          VERSION="$RELEASE_TAG"
        elif [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'latest')
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        # 添加仓库名小写转换
        echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
    
    - name: 登录镜像仓库
      run: |
        echo "${{ secrets.IMAGE_PASS }}" | docker login ${{ env.ACR_HOST }} -u ${{ secrets.IMAGE_USER }} --password-stdin
    
    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 构建并推送到你的阿里云 ACR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
        push: true
        provenance: false
        tags: |
          ${{ env.ACR }}/thingspanel-gmqtt:${{ env.VERSION }}
